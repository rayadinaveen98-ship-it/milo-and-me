name: Android playtest APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Prepare Android wrapper
        run: python3 tool/bootstrap_android.py
      - name: Resolve dependencies
        run: flutter pub get
      - name: Validate original content
        run: python3 tool/validate_content.py assets/content/meadow.json
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test --coverage
      - name: Build installable debug APK
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: milo-and-me-0.1.0-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-lock-and-coverage
          path: |
            pubspec.lock
            coverage/lcov.info
