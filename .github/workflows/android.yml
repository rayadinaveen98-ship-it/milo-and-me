name: Android playtest APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Prepare official Android wrapper
        run: python3 tool/bootstrap_android.py
      - name: Install dependencies
        run: flutter pub get
      # Explicit SQL Drift implementation: no generated Dart files are required.
      - name: Validate content and offline invariants
        run: |
          python3 tool/validate_content.py assets/content/meadow.json
          python3 tool/test_offline.py
      - name: Flutter static analysis
        run: flutter analyze
      - name: All Flutter tests
        run: flutter test --coverage
      - name: Build Android debug APK
        run: flutter build apk --debug
      - name: Record APK identity
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          apk = pathlib.Path('build/app/outputs/flutter-apk/app-debug.apk')
          report = {'commit': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'], 'version': '0.1.0+1', 'build_type': 'debug', 'sha256': hashlib.sha256(apk.read_bytes()).hexdigest()}
          apk.with_name('build-manifest.json').write_text(json.dumps(report, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: milo-and-me-0.1.0-debug-apk-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/build-manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain dependency lock and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-details-${{ github.sha }}
          path: |
            pubspec.lock
            coverage/lcov.info
          if-no-files-found: warn
          retention-days: 30
