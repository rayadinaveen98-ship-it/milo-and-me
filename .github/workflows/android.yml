name: Android playtest APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Prepare official Android wrapper
        run: python3 tool/bootstrap_android.py
      - name: Install dependencies
        run: flutter pub get
      - name: Format Dart source
        run: |
          dart format lib test
          dart fix --apply --code=curly_braces_in_flow_control_structures
          dart format lib test
      - name: Retain reproducible dependency and wrapper inputs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib test pubspec.lock android/gradlew android/gradlew.bat android/gradle/wrapper
          if ! git diff --cached --quiet; then
            git commit -m 'Retain resolved Flutter dependencies and official Gradle wrapper'
            git push origin HEAD:main
          fi
      # Explicit SQL Drift implementation: no generated Dart files are required.
      - name: Validate content and offline invariants
        run: |
          python3 tool/validate_content.py assets/content/meadow.json
          python3 tool/test_offline.py
      - name: Flutter static analysis
        run: flutter analyze
      - name: All Flutter tests
        timeout-minutes: 5
        run: flutter test --coverage --reporter expanded --timeout 90s
      - name: Build Android debug APK
        run: flutter build apk --debug
      - name: Record APK identity
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          apk = pathlib.Path('build/app/outputs/flutter-apk/app-debug.apk')
          report = {'commit': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(), 'run_id': os.environ['GITHUB_RUN_ID'], 'version': pathlib.Path('pubspec.yaml').read_text().split('version: ')[1].splitlines()[0], 'build_type': 'debug', 'sha256': hashlib.sha256(apk.read_bytes()).hexdigest()}
          apk.with_name('build-manifest.json').write_text(json.dumps(report, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: milo-and-me-debug-apk-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/build-manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain dependency lock and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-details-${{ github.sha }}
          path: |
            pubspec.lock
            coverage/lcov.info
          if-no-files-found: warn
          retention-days: 30
      - name: Publish verified milestone APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYCODE'
          import json,pathlib,subprocess
          root=pathlib.Path('build/app/outputs/flutter-apk')
          manifest=json.loads((root/'build-manifest.json').read_text())
          version=manifest['version'].split('+')[0]
          tag='v'+version
          apk=root/('Milo-and-Me-v'+version+'.apk')
          apk.write_bytes((root/'app-debug.apk').read_bytes())
          notes=pathlib.Path('milestone-notes.md')
          notes.write_text('Android debug playtest. Analysis, all tests and APK build passed.\n\nSource: '+manifest['commit']+'\n\nSee docs/RELEASE_NOTES.md for changes and external activation requirements.')
          if subprocess.run(['gh','release','view',tag],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode:
            subprocess.run(['gh','release','create',tag,'--target',manifest['commit'],'--prerelease','--title','Milo & Me '+version,'--notes-file',str(notes)],check=True)
          subprocess.run(['gh','release','upload',tag,str(apk),str(root/'build-manifest.json'),'--clobber'],check=True)
          PYCODE
