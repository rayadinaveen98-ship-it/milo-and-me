name: milo_and_me
description: A local-first storybook companion for creative little explorers.
publish_to: none
version: 0.7.5+8
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 2.6.1
  go_router: 14.8.1
  flame: 1.30.1
  drift: 2.28.1
  sqlite3_flutter_libs: 0.5.39
  path_provider: 2.1.5
  path: 1.9.1
  flutter_secure_storage: 9.2.4
  crypto: 3.0.6
  audioplayers: 6.5.0
  http: 1.4.0
  in_app_purchase: 3.2.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/content/
    - assets/brand/
    - assets/audio/
    - assets/art/
